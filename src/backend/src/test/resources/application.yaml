# 統合テスト用。データソースは Testcontainers（または外部 PostgreSQL）が動的に設定する
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

kintai:
  business-zone: Asia/Tokyo

logging:
  level:
    org.flywaydb: INFO
