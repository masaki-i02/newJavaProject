# 統合テスト用。データソースは Testcontainers（または外部 PostgreSQL）が動的に設定する
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

kintai:
  business-zone: Asia/Tokyo
  paid-leave:
    grant-scheduler:
      # ★ テストで年休の付与バッチを動かさない。
      #   固定した時計とは無関係に実時刻で走り、テストの前提を黙って書き換える
      enabled: false

logging:
  level:
    org.flywaydb: INFO
