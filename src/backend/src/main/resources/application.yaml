spring:
  application:
    name: kintai

  # 日付・日時は ISO 8601 で受け取る。既定の書式に頼ると、
  # ロケールによって解釈が変わる（API 共通仕様 1）
  mvc:
    format:
      date: iso
      date-time: iso
      time: iso

  datasource:
    url: ${KINTAI_DB_URL:jdbc:postgresql://localhost:5432/kintai}
    username: ${KINTAI_DB_USER:kintai}
    password: ${KINTAI_DB_PASSWORD:kintai}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 本番でスキーマを勝手に直さない。差異は必ずマイグレーションで表現する
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    # スキーマは Flyway が作る。Hibernate に触らせない
    hibernate:
      ddl-auto: validate
    # トランザクション境界は application 層の公開メソッド（アーキテクチャ設計書 6.1）
    open-in-view: false
    properties:
      hibernate:
        # hibernate.jdbc.time_zone は設定しない。
        # JDBC 層が time 型のカラムまで変換し、深夜帯 22:00-05:00 が
        # 別の時刻として読み込まれる（CLAUDE.md 落とし穴 1）
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# ドメインは壁掛け時計時刻（LocalDateTime）を扱い、DB は timestamptz。
# 変換は shared.domain.BusinessZone（Asia/Tokyo）に集約する（アーキテクチャ設計書 6.3）。
# 設定値にはしない。あとから変えると、過去に記録した打刻の解釈まで遡って変わる

kintai:
  paid-leave:
    grant-scheduler:
      enabled: true
      # 深夜に実行する。付与日は 0 時に到来するので、その日のうちに作られる
      cron: "0 30 2 * * *"

logging:
  pattern:
    # 開発は読みやすいテキスト。相関 ID だけを足す（本番は JSON。application-prod.yaml）
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # health と info だけ。env・beans・configprops は出さない
        # （設定値と依存の一覧は攻撃者に有用で、監視には要らない）
        include: health,info
  endpoint:
    health:
      # ★ liveness と readiness を分ける。
      #   分けないと、Flyway が 8 本のマイグレーションを流している最中に
      #   トラフィックが入る
      probes:
        enabled: true
      # 依存の状態を出すのは認証済みのときだけ。
      # 未認証のプローブには UP / DOWN だけを返す
      show-details: when-authorized
  health:
    # readiness に DB を含める。DB へ繋がらないアプリは要求を受けられない
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
