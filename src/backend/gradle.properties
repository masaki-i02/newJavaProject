# 設計書・テスト名・コメントを日本語で書いているため、文字コードを UTF-8 に固定する。
#
# file.encoding だけでは足りない。テストレポートのファイル名（テスト名がそのまま入る）は
# sun.jnu.encoding で扱われるため、locale が POSIX / C の環境では
# 「Malformed input or input contains unmappable characters」でレポート生成が落ちる。
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
