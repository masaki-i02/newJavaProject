# 本番相当の構成。
#
#   cp .env.example .env   # 値を書き換える
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 開発用は docker-compose.yml（DB だけを起動する）。
#
# ★ 1 インスタンスで運用する（ADR 0009）。
#   セッションはインメモリなので、レプリカを増やすと再ログインが必要になる。
#   100 名・同時 50 の規模ではスケールアウトする理由が無い。
services:
  db:
    image: postgres:16-alpine
    container_name: kintai-db-prod
    environment:
      POSTGRES_DB: ${KINTAI_DB_NAME}
      POSTGRES_USER: ${KINTAI_DB_USER}
      POSTGRES_PASSWORD: ${KINTAI_DB_PASSWORD}
      # 照合順序を固定しないと環境によってソート結果が変わる
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Tokyo
    # ★ ホストへ公開しない。app からだけ届けばよい。
    #   開発用の docker-compose.yml は 5432 を公開しているが、本番では塞ぐ
    expose:
      - "5432"
    volumes:
      - kintai-pgdata:/var/lib/postgresql/data
      # バックアップの置き場。ホスト側で世代を管理する
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KINTAI_DB_USER} -d ${KINTAI_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        # ★ 上限を付けないとログでディスクが埋まる
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  app:
    build:
      # ★ 文脈はリポジトリの根。画面（src/frontend）も同じ像に入れるため、
      #   src/backend より上を読めないと COPY できない
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: kintai-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # ★ 既定値を持たせない。application-prod.yaml も持っていないので、
      #   渡し忘れると起動が失敗する。localhost の開発 DB へ黙って繋がるより安全
      KINTAI_DB_URL: jdbc:postgresql://db:5432/${KINTAI_DB_NAME}
      KINTAI_DB_USER: ${KINTAI_DB_USER}
      KINTAI_DB_PASSWORD: ${KINTAI_DB_PASSWORD}
    ports:
      - "${KINTAI_APP_PORT:-8080}:8080"
    depends_on:
      db:
        # ★ 起動順ではなく健全性を待つ。Flyway が接続できないと起動に失敗する
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  kintai-pgdata:
