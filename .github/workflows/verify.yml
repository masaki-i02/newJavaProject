# 検証の自動化。
#
# ★ ここに置く手順は、開発者が手元で実行しているものと同じにする。
#   CI だけが知っている手順を増やすと、手元で緑なのに CI で落ちる（逆も同じ）。
#
# ★ この定義は、この環境から GitHub Actions を実行できないため
#   **一度も走ったところを確認できていない**（doc/08_運用/README.md の未検証の一覧）。
#   最初の 1 回は結果を見て直すこと。
name: verify

on:
  push:
    branches: ['**']
  pull_request:

# 同じブランチへ続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ★ ロケールを UTF-8 に固定する。POSIX / C だと ArchUnit と JUnit の
  #   レポート書き出しが「Malformed input」で落ちる（CLAUDE.md 落とし穴 29・129）
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  backend:
    name: バックエンド（javac と ecj の 2 つのコンパイラ・テスト 1000 件超・実物の PostgreSQL）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # ★ Eclipse のコンパイラでも通ることを確かめる。
      #   javac と ecj は型推論の実装が違うので、javac が通すコードを ecj が拒むことがある。
      #   開発を Eclipse で行う以上、javac だけを見ていると IDE だけが赤くなる（落とし穴 181）
      - name: ecj（Eclipse のコンパイラ）でも通ることを確かめる
        working-directory: src/backend
        run: ./gradlew ecjCheck --no-daemon
      # ★ H2 を使わない（落とし穴 6）。Testcontainers が postgres:16-alpine を起動する。
      #   ubuntu-latest には Docker があるので、追加の service は要らない
      - name: test
        working-directory: src/backend
        run: ./gradlew test --no-daemon
      - name: テストレポートを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: src/backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: フロントエンド（型検査と単体テスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: install
        working-directory: src/frontend
        run: npm ci
      # ★ 型検査を別の段にする。テストだけだと、画面が読まない項目の
      #   型の食い違いが素通りする（落とし穴 143）
      - name: typecheck
        working-directory: src/frontend
        run: npm run typecheck
      - name: test
        working-directory: src/frontend
        run: npm test
      # ★ ビルドも通す。型検査と単体テストが通っても vite build は落ちうるし、
      #   落ちれば像に画面が入らない（ログイン画面が配信されなくなる）
      - name: build
        working-directory: src/frontend
        run: npm run build

  docs:
    name: 設計書と実装の突き合わせ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ★ 生成物は設計書を正とする（CLAUDE.md 4.1）。
      #   生成し直して差分が出たら、設計書だけを直して生成し忘れている
      - name: テストケース一覧を生成して突き合わせる
        working-directory: doc/_tools
        run: python3 collect-tests.py
      - name: 設計書の API 一覧と実装の経路を突き合わせる
        working-directory: doc/_tools
        run: python3 check-endpoints.py
      # ★ 画面はエラーの type で分岐するので、型の一覧も契約である。
      #   設計書が `department-cycle` / 409 と書き、実装が
      #   `cyclic-department-hierarchy` / 422 を返していた（落とし穴 108・174）
      - name: エラーの型を設計書と突き合わせる
        working-directory: doc/_tools
        run: python3 check-error-codes.py
      # ★ 日本語の識別子は Java の仕様としては合法なので、コンパイラは何も言わない。
      #   引数名は ArchUnit（バイトコード）からも見えないので、源泉を読む（落とし穴 29・74・129）
      - name: 本番コードの識別子が ASCII であることを確かめる
        working-directory: doc/_tools
        run: python3 check-identifiers.py
      # ★ 画面だけが手で数えられていた。テストは存在する画面しか検査しないので、
      #   設計書にあって実装が無い画面は実ブラウザの通しが 12 件あっても落ちない（落とし穴 155）
      - name: 画面設計書の一覧と実装を突き合わせる
        working-directory: doc/_tools
        run: python3 check-screens.py
      - name: マイグレーションを生成する
        working-directory: doc/_tools
        run: python3 build-migrations.py
      - name: 生成物に差分が無いことを確かめる
        run: |
          if ! git diff --exit-code -- doc src/backend/src/main/resources/db/migration; then
            echo '::error::生成物が設計書と一致していません。' \
                 'doc/_tools の生成器を実行してからコミットしてください'
            exit 1
          fi
